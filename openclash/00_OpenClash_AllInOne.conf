    proxies: ["🎞️ 1.0x 🇯🇵 日本 JP - 0", "🎞️ 1.0x 🇯🇵 日本 JP - o2", "🎞️ 1.0x 🇯🇵 日本 JP - o3", "🎞️ 1.0x 🇯🇵 日本 JP - o4", "🎞️ 1.0x 🇯🇵 日本 JP - OC", "[其他不能用再用这个] JP 🎞️ 1.0x 🇯🇵 日本", "[其他不能用再用这个] JP 🏠 2.0x 🇯🇵 日本", "🛰 [星链] 2.0x 🇯🇵 日本 JP - 0", "🛰 [星链] 2.0x 🇯🇵 日本 JP - o2", "🛰 [星链] 2.0x 🇯🇵 日本 JP - o3", "🛰 [星链] 2.0x 🇯🇵 日本 JP - o4", "🛰 [星链] 2.0x 🇯🇵 日本 JP - OC", "[其他不能用再用这个] JP 🛰 2.0x 🇯🇵 日本"]
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
  - name: "🇺🇸 美国节点"
    type: url-test
    proxies: ["🎞️ 1.0x 🇺🇸 美国 US - 0", "🎞️ 1.0x 🇺🇸 美国 US - o2", "🎞️ 1.0x 🇺🇸 美国 US - o3", "🎞️ 1.0x 🇺🇸 美国 US - o4", "🎞️ 1.0x 🇺🇸 美国 US - OC", "[其他不能用再用这个] US 🎞️ 1.0x 🇺🇸 美国", "[其他不能用再用这个] US 🏠 1.0x 🇺🇸 美国"]
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
  - name: "🇭🇰 香港家宽"
    type: url-test
    proxies: ["🏠 [家宽] 1.0x 🇭🇰 香港 HK - S1", "🏠 [家宽] 1.0x 🇭🇰 香港 HK - 0", "🏠 [家宽] 1.0x 🇭🇰 香港 HK - o2", "🏠 [家宽] 1.0x 🇭🇰 香港 HK - o3", "🏠 [家宽] 1.0x 🇭🇰 香港 HK - o4", "🏠 [家宽] 1.0x 🇭🇰 香港 HK - OC"]
