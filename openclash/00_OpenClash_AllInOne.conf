    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
  - name: "🇯🇵 日本家宽"
    type: url-test
    proxies: ["🏠 [家宽] 2.0x 🇯🇵 日本 JP - 0", "🏠 [家宽] 2.0x 🇯🇵 日本 JP - o2", "🏠 [家宽] 2.0x 🇯🇵 日本 JP - o3", "🏠 [家宽] 2.0x 🇯🇵 日本 JP - o4", "🏠 [家宽] 2.0x 🇯🇵 日本 JP - OC"]
