[YAML]
# OpenClash unified custom layer for Xeno subscription.
# Use this file as the ONLY custom strategy/region/CDN module; disable the old split modules.
# It stores node names only, never proxy credentials.

# 0) Remove the previous 8 same-name region groups if they are already present.
# OpenClash array deletion compares the whole group object; these definitions match the current Xeno baseline.
# This prevents +proxy-groups from leaving two groups with the same name.
proxy-groups-:
- name: 🇭🇰 香港节点
  type: url-test
  include-all: true
  url: https://www.gstatic.com/generate_204
  interval: 120
  tolerance: 100
  lazy: false
  empty-fallback: REJECT
- name: 🇹🇼 台湾节点
  type: url-test
  include-all: true
  url: https://www.gstatic.com/generate_204
  interval: 120
  tolerance: 100
  lazy: false
  empty-fallback: REJECT
- name: 🇯🇵 日本节点
  type: url-test
  include-all: true
  url: https://www.gstatic.com/generate_204
  interval: 120
  tolerance: 100
  lazy: false
  empty-fallback: REJECT
- name: 🇺🇸 美国节点
  type: url-test
  include-all: true
  url: https://www.gstatic.com/generate_204
  interval: 120
  tolerance: 100
  lazy: false
  empty-fallback: REJECT
- name: 🇭🇰 香港家宽
  type: url-test
  include-all: true
  exclude-filter: 直连
  url: https://www.gstatic.com/generate_204
  interval: 120
  tolerance: 100
  lazy: false
  empty-fallback: REJECT
- name: 🇹🇼 台湾家宽
  type: url-test
  include-all: true
  exclude-filter: 直连
  url: https://www.gstatic.com/generate_204
  interval: 120
  tolerance: 100
  lazy: false
  empty-fallback: REJECT
- name: 🇯🇵 日本家宽
  type: url-test
  include-all: true
  exclude-filter: 直连
  url: https://www.gstatic.com/generate_204
  interval: 120
  tolerance: 100
  lazy: false
  empty-fallback: REJECT
- name: 🇺🇸 美国家宽
  type: url-test
  include-all: true
  exclude-filter: 直连
  url: https://www.gstatic.com/generate_204
  interval: 120
  tolerance: 100
  lazy: false
  empty-fallback: REJECT

# 1) Hard-coded regional pools + custom business groups.
+proxy-groups:
  - name: "🇭🇰 香港节点"
    type: url-test
    proxies:
      - "🎞️ 1.0x 🇭🇰 香港 HK - S1"
      - "🎞️ 1.0x 🇭🇰 香港 HK - 0"
      - "🎞️ 1.0x 🇭🇰 香港 HK - o2"
      - "🎞️ 1.0x 🇭🇰 香港 HK - o3"
      - "🎞️ 1.0x 🇭🇰 香港 HK - o4"
      - "🎞️ 1.0x 🇭🇰 香港 HK - OC"
      - "[其他不能用再用这个] HK 🎞️ 🇭🇰 香港"
      - "[其他不能用再用这个] HK 🏠 🇭🇰 香港"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇹🇼 台湾节点"
    type: url-test
    proxies:
      - "🎞️ 1.0x 🇹🇼 台湾 TW - S1"
      - "🎞️ 1.0x 🇹🇼 台湾 TW - 0"
      - "🎞️ 1.0x 🇹🇼 台湾 TW - o2"
      - "🎞️ 1.0x 🇹🇼 台湾 TW - o3"
      - "🎞️ 1.0x 🇹🇼 台湾 TW - o4"
      - "🎞️ 1.0x 🇹🇼 台湾 TW - OC"
      - "[其他不能用再用这个] TW 🎞️ 🇹🇼 台湾"
      - "[其他不能用再用这个] TW 🏠  🇹🇼 台湾 TW"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇯🇵 日本节点"
    type: url-test
    proxies:
      - "🎞️ 1.0x 🇯🇵 日本 JP - 0"
      - "🎞️ 1.0x 🇯🇵 日本 JP - o2"
      - "🎞️ 1.0x 🇯🇵 日本 JP - o3"
      - "🎞️ 1.0x 🇯🇵 日本 JP - o4"
      - "🎞️ 1.0x 🇯🇵 日本 JP - OC"
      - "[其他不能用再用这个] JP 🎞️ 1.0x 🇯🇵 日本"
      - "[其他不能用再用这个] JP 🏠 2.0x 🇯🇵 日本"
      - "🛰 [星链] 2.0x 🇯🇵 日本 JP - 0"
      - "🛰 [星链] 2.0x 🇯🇵 日本 JP - o2"
      - "🛰 [星链] 2.0x 🇯🇵 日本 JP - o3"
      - "🛰 [星链] 2.0x 🇯🇵 日本 JP - o4"
      - "🛰 [星链] 2.0x 🇯🇵 日本 JP - OC"
      - "[其他不能用再用这个] JP 🛰 2.0x 🇯🇵 日本"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇺🇸 美国节点"
    type: url-test
    proxies:
      - "🎞️ 1.0x 🇺🇸 美国 US - 0"
      - "🎞️ 1.0x 🇺🇸 美国 US - o2"
      - "🎞️ 1.0x 🇺🇸 美国 US - o3"
      - "🎞️ 1.0x 🇺🇸 美国 US - o4"
      - "🎞️ 1.0x 🇺🇸 美国 US - OC"
      - "[其他不能用再用这个] US 🎞️ 1.0x 🇺🇸 美国"
      - "[其他不能用再用这个] US 🏠 1.0x 🇺🇸 美国"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇭🇰 香港家宽"
    type: url-test
    proxies:
      - "🏠 [家宽] 1.0x 🇭🇰 香港 HK - S1"
      - "🏠 [家宽] 1.0x 🇭🇰 香港 HK - 0"
