    tolerance: 100
    lazy: false
  - name: "🇺🇸 美国家宽"
    type: url-test
    proxies: ["[不保Tiktok] 🏠 [家宽] 1.0x 🇺🇸 美国 US - 0", "[不保Tiktok] 🏠 [家宽] 1.0x 🇺🇸 美国 US - o2", "[不保Tiktok] 🏠 [家宽] 1.0x 🇺🇸 美国 US - o3", "[不保Tiktok] 🏠 [家宽] 1.0x 🇺🇸 美国 US - o4", "[不保Tiktok] 🏠 [家宽] 1.0x 🇺🇸 美国 US - OC"]
