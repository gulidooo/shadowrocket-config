# OpenClash All-in-One
# Single-file additive design: no proxy-groups*, no deletion, no mutation of existing Xeno groups.
# Regional groups are explicit supersets: each 地区节点 includes ordinary + home-broadband nodes; 家宽 is the home-broadband subset.
# Business groups are self-contained; rules point directly to these groups. Xeno's original 🔰 节点选择 is reused as fallback.
# Node credentials are NOT stored here; only exact proxy names are referenced.

[General]
RESTART = true

[YAML]
+proxy-groups:
- name: 🇭🇰 香港节点
  type: url-test
  proxies:
  - 🎞️ 1.0x 🇭🇰 香港 HK - S1
  - 🎞️ 1.0x 🇭🇰 香港 HK - 0
  - 🎞️ 1.0x 🇭🇰 香港 HK - o2
  - 🎞️ 1.0x 🇭🇰 香港 HK - o3
  - 🎞️ 1.0x 🇭🇰 香港 HK - o4
  - 🎞️ 1.0x 🇭🇰 香港 HK - OC
  - '[其他不能用再用这个] HK 🎞️ 🇭🇰 香港'
  - '[其他不能用再用这个] HK 🏠 🇭🇰 香港'
  - '🏠 [家宽] 1.0x 🇭🇰 香港 HK - S1'
  - '🏠 [家宽] 1.0x 🇭🇰 香港 HK - 0'
  - '🏠 [家宽] 1.0x 🇭🇰 香港 HK - o2'
  - '🏠 [家宽] 1.0x 🇭🇰 香港 HK - o3'
