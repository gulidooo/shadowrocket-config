# OpenClash All-in-One — Full Control
# Single-file self-contained strategy replacement.
# Every original Xeno selectable policy can directly choose the 8 custom regional/home groups.
# Broad original selectors keep subscription nodes dynamic via include-all; regional groups remain exact hard-coded node names.
# No proxy-groups* cross-stage mutation is used.

[General]
RESTART = true

[YAML]
proxy-groups!:
- name: 🇭🇰 香港节点
  type: url-test
  proxies:
  - 🎞️ 1.0x 🇭🇰 香港 HK - S1
