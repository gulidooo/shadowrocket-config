# OpenClash All-in-One
# Single-file additive design: no proxy-groups*, no deletion, no mutation of existing Xeno groups.
# Custom groups are declared self-contained in one +proxy-groups block; no mutation of existing Xeno groups.
# Node credentials are NOT stored here; only exact proxy names are referenced.

[General]
RESTART = true

[YAML]
+proxy-groups:
- name: 🇭🇰 香港节点
  type: url-test
  proxies:
  - 🎞️ 1.0x 🇭🇰 香港 HK - S1
  - 🎞️ 1.0x 🇭🇰 香港 HK - 0
  - 🎞️ 1.0x 🇭🇰 香港 HK - o2
  - 🎞️ 1.0x 🇭🇰 香港 HK - o3
  - 🎞️ 1.0x 🇭🇰 香港 HK - o4
  - 🎞️ 1.0x 🇭🇰 香港 HK - OC
  - '[其他不能用再用这个] HK 🎞️ 🇭🇰 香港'
  - '[其他不能用再用这个] HK 🏠 🇭🇰 香港'
  url: https://www.gstatic.com/generate_204
  interval: 120
  tolerance: 100
  lazy: false
  empty-fallback: REJECT
- name: 🇹🇼 台湾节点
  type: url-test
  proxies:
  - 🎞️ 1.0x 🇹🇼 台湾 TW - S1
  - 🎞️ 1.0x 🇹🇼 台湾 TW - 0
  - 🎞️ 1.0x 🇹🇼 台湾 TW - o2
  - 🎞️ 1.0x 🇹🇼 台湾 TW - o3
  - 🎞️ 1.0x 🇹🇼 台湾 TW - o4
  - 🎞️ 1.0x 🇹🇼 台湾 TW - OC
  - '[其他不能用再用这个] TW 🎞️ 🇹🇼 台湾'
  - '[其他不能用再用这个] TW 🏠  🇹🇼 台湾 TW'
  url: https://www.gstatic.com/generate_204
  interval: 120
  tolerance: 100
  lazy: false
  empty-fallback: REJECT
- name: 🇯🇵 日本节点
  type: url-test
  proxies:
  - 🎞️ 1.0x 🇯🇵 日本 JP - 0
  - 🎞️ 1.0x 🇯🇵 日本 JP - o2
