  - 🛰 [星链] 2.0x 🇯🇵 日本 JP - o4
  - 🛰 [星链] 2.0x 🇯🇵 日本 JP - OC
  - '[其他不能用再用这个] JP 🛰 2.0x 🇯🇵 日本'
