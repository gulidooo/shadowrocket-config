      - "🏠 [家宽] 1.0x 🇭🇰 香港 HK - o3"
      - "🏠 [家宽] 1.0x 🇭🇰 香港 HK - o4"
      - "🏠 [家宽] 1.0x 🇭🇰 香港 HK - OC"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇹🇼 台湾家宽"
    type: url-test
    proxies:
      - "🏠 [家宽] 1.0x 🇹🇼 台湾 TW - 0"
      - "🏠 [家宽] 1.0x 🇹🇼 台湾 TW - o2"
      - "🏠 [家宽] 1.0x 🇹🇼 台湾 TW - o3"
      - "🏠 [家宽] 1.0x 🇹🇼 台湾 TW - o4"
      - "🏠 [家宽] 1.0x 🇹🇼 台湾 TW - OC"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇯🇵 日本家宽"
    type: url-test
    proxies:
      - "🏠 [家宽] 2.0x 🇯🇵 日本 JP - 0"
      - "🏠 [家宽] 2.0x 🇯🇵 日本 JP - o2"
      - "🏠 [家宽] 2.0x 🇯🇵 日本 JP - o3"
      - "🏠 [家宽] 2.0x 🇯🇵 日本 JP - o4"
      - "🏠 [家宽] 2.0x 🇯🇵 日本 JP - OC"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇺🇸 美国家宽"
    type: url-test
    proxies:
      - "[不保Tiktok] 🏠 [家宽] 1.0x 🇺🇸 美国 US - 0"
      - "[不保Tiktok] 🏠 [家宽] 1.0x 🇺🇸 美国 US - o2"
      - "[不保Tiktok] 🏠 [家宽] 1.0x 🇺🇸 美国 US - o3"
      - "[不保Tiktok] 🏠 [家宽] 1.0x 🇺🇸 美国 US - o4"
      - "[不保Tiktok] 🏠 [家宽] 1.0x 🇺🇸 美国 US - OC"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "✨ Gemini"
    type: select
    proxies:
      - "🇯🇵 日本家宽"
      - "🇺🇸 美国家宽"
      - "🇹🇼 台湾家宽"
      - "🇭🇰 香港家宽"
      - "🇯🇵 日本节点"
      - "🇺🇸 美国节点"
      - "🇹🇼 台湾节点"
      - "🇭🇰 香港节点"
      - DIRECT
      - REJECT

  - name: "📺 YouTube"
    type: select
    proxies:
      - "🇯🇵 日本家宽"
      - "🇺🇸 美国家宽"
      - "🇹🇼 台湾家宽"
      - "🇭🇰 香港家宽"
      - "🇯🇵 日本节点"
      - "🇺🇸 美国节点"
      - "🇹🇼 台湾节点"
      - "🇭🇰 香港节点"
      - DIRECT
      - REJECT

  - name: "🪙 OKX"
    type: select
    proxies:
      - "🇭🇰 香港家宽"
      - "🇯🇵 日本家宽"
      - "🇺🇸 美国家宽"
      - "🇹🇼 台湾家宽"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇺🇸 美国节点"
      - "🇹🇼 台湾节点"
      - DIRECT
      - REJECT

  - name: "🎯 Polymarket US"
    type: select
    proxies:
      - "🇺🇸 美国家宽"
      - "🇺🇸 美国节点"
      - REJECT

  - name: "📈 香港券商"
    type: select
    proxies:
      - "🇭🇰 香港家宽"
      - "🇭🇰 香港节点"
      - DIRECT
      - REJECT

# 2) Inject regional pools into Xeno's existing ChatGPT / Claude / Twitter / node selector groups.
# One proxy-groups* operation only.
proxy-groups*:
  where:
    name: '/(ChatGPT|Claude\.Ai|推特|节点选择)$/'
  set:
    +proxies:
      - "🇯🇵 日本家宽"
      - "🇺🇸 美国家宽"
      - "🇹🇼 台湾家宽"
      - "🇭🇰 香港家宽"
      - "🇯🇵 日本节点"
      - "🇺🇸 美国节点"
      - "🇹🇼 台湾节点"
      - "🇭🇰 香港节点"

# 3) Auto-updating rule providers used by business and China-direct rules.
+rule-providers:
  gemini_auto:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google-gemini.mrs"
  youtube_auto:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs"
  okx_auto:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/okx.mrs"
  china_no_ip:
    type: http
    behavior: domain
    format: text
    interval: 86400
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMaxNoIP/ChinaMaxNoIP.list"

