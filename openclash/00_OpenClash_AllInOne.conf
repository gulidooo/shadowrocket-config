[YAML]
# Single-file OpenClash override for Xeno subscription.
# Keeps subscription nodes dynamic; this file only references node names.
# No proxy credentials are stored here.

# 1) Create hard-coded regional and residential pools.
+proxy-groups:
  - name: "🇭🇰 香港节点"
    type: url-test
    proxies: ["🎞️ 1.0x 🇭🇰 香港 HK - S1", "🎞️ 1.0x 🇭🇰 香港 HK - 0", "🎞️ 1.0x 🇭🇰 香港 HK - o2", "🎞️ 1.0x 🇭🇰 香港 HK - o3", "🎞️ 1.0x 🇭🇰 香港 HK - o4", "🎞️ 1.0x 🇭🇰 香港 HK - OC", "[其他不能用再用这个] HK 🎞️ 🇭🇰 香港", "[其他不能用再用这个] HK 🏠 🇭🇰 香港"]
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
  - name: "🇹🇼 台湾节点"
    type: url-test
    proxies: ["🎞️ 1.0x 🇹🇼 台湾 TW - S1", "🎞️ 1.0x 🇹🇼 台湾 TW - 0", "🎞️ 1.0x 🇹🇼 台湾 TW - o2", "🎞️ 1.0x 🇹🇼 台湾 TW - o3", "🎞️ 1.0x 🇹🇼 台湾 TW - o4", "🎞️ 1.0x 🇹🇼 台湾 TW - OC", "[其他不能用再用这个] TW 🎞️ 🇹🇼 台湾", "[其他不能用再用这个] TW 🏠  🇹🇼 台湾 TW"]
