block-quic = all-proxy

[Proxy Group]
🚀 节点选择 = select,PROXY,DIRECT,REJECT,♻️ 自动选择,🇭🇰 香港节点,🇹🇼 台湾节点,🇯🇵 日本节点,🇺🇸 美国节点,🌐 其他节点,🇭🇰 香港家宽,🇹🇼 台湾家宽,🇯🇵 日本家宽,🇺🇸 美国家宽,🌐 其他家宽
♻️ 自动选择 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=^((?!(剩余流量|距离下次|套餐到期|Telegram|公告|官网|更新订阅|无法更新|重新前往)).)*$
🇭🇰 香港节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港
🇹🇼 台湾节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化
🇯🇵 日本节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪
🇺🇸 美国节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|美
🌐 其他节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=^((?!(🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港|🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化|🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美|美)).)*$
🇭🇰 香港家宽 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=(?=.*家宽)(?=.*(🇭🇰|HK|Hong|hong|香港))^((?!(直连)).)*$
🇹🇼 台湾家宽 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=(?=.*家宽)(?=.*(🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣))^((?!(直连)).)*$
🇯🇵 日本家宽 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=(?=.*家宽)(?=.*(🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪))^((?!(直连)).)*$
🇺🇸 美国家宽 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=(?=.*家宽)(?=.*(🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约))^((?!(直连)).)*$
🌐 其他家宽 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=(?=.*家宽)^((?!(直连|🇭🇰|HK|Hong|hong|香港|🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约)).)*$
