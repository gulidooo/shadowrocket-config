[YAML]
# OpenClash unified override - 2026-08-30
# 地区池修正版：使用 Mihomo include-all + filter；家宽池额外排除“直连”。
# 不包含机场订阅 URL/凭证。

+proxy-groups:
  # ===== 普通地区池 =====
  - name: "🇭🇰 香港节点"
    type: url-test
    include-all: true
    filter: "(?i)港|hk|hongkong|hong kong"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇹🇼 台湾节点"
    type: url-test
    include-all: true
    filter: "(?i)台|tw|taiwan"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇯🇵 日本节点"
    type: url-test
    include-all: true
    filter: "(?i)日|jp|japan"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇺🇸 美国节点"
    type: url-test
    include-all: true
    filter: "(?i)美|us|unitedstates|united states"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  # ===== 严格家宽池：地区 + 家宽，并排除节点名含“直连” =====
  - name: "🇭🇰 香港家宽"
    type: url-test
    include-all: true
    filter: "(?i)(?=.*家宽)(?=.*(港|hk|hongkong|hong kong)).*"
    exclude-filter: "直连"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇹🇼 台湾家宽"
    type: url-test
    include-all: true
    filter: "(?i)(?=.*家宽)(?=.*(台|tw|taiwan)).*"
    exclude-filter: "直连"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇯🇵 日本家宽"
    type: url-test
    include-all: true
    filter: "(?i)(?=.*家宽)(?=.*(日|jp|japan)).*"
    exclude-filter: "直连"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇺🇸 美国家宽"
    type: url-test
    include-all: true
    filter: "(?i)(?=.*家宽)(?=.*(美|us|unitedstates|united states)).*"
    exclude-filter: "直连"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  # ===== 业务策略 =====
  - name: "✨ Gemini"
    type: select
    proxies: ["🇯🇵 日本家宽", "🇺🇸 美国家宽", "🇹🇼 台湾家宽", "🇭🇰 香港家宽", "🇯🇵 日本节点", "🇺🇸 美国节点", "🇹🇼 台湾节点", "🇭🇰 香港节点", "DIRECT", "REJECT"]

  - name: "📺 YouTube"
    type: select
    proxies: ["🇯🇵 日本家宽", "🇺🇸 美国家宽", "🇹🇼 台湾家宽", "🇭🇰 香港家宽", "🇯🇵 日本节点", "🇺🇸 美国节点", "🇹🇼 台湾节点", "🇭🇰 香港节点", "DIRECT", "REJECT"]

  - name: "🪙 OKX"
    type: select
    proxies: ["🇭🇰 香港家宽", "🇯🇵 日本家宽", "🇺🇸 美国家宽", "🇹🇼 台湾家宽", "🇭🇰 香港节点", "🇯🇵 日本节点", "🇺🇸 美国节点", "🇹🇼 台湾节点", "DIRECT", "REJECT"]

  - name: "🎯 Polymarket US"
    type: select
    proxies: ["🇺🇸 美国家宽", "🇺🇸 美国节点", "REJECT"]

  - name: "📈 香港券商"
    type: select
    proxies: ["🇭🇰 香港家宽", "🇭🇰 香港节点", "DIRECT", "REJECT"]

proxy-groups*:
  where:
    name: '/ChatGPT$/'
  set:
    +proxies:
      - "🇯🇵 日本家宽"
      - "🇺🇸 美国家宽"
      - "🇹🇼 台湾家宽"
      - "🇭🇰 香港家宽"
      - "🇯🇵 日本节点"
      - "🇺🇸 美国节点"
      - "🇹🇼 台湾节点"
      - "🇭🇰 香港节点"

+rule-providers:
  gemini_auto:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google-gemini.mrs"
  youtube_auto:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs"
  okx_auto:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/okx.mrs"
  china_no_ip:
    type: http
    behavior: domain
    format: text
    interval: 86400
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMaxNoIP/ChinaMaxNoIP.list"

+rules:
  # AI / 国际业务
  - DOMAIN,optimizationguide-pa.googleapis.com,✨ Gemini
  - DOMAIN,robinfrontend-pa.googleapis.com,✨ Gemini
  - DOMAIN,webchannel-robinfrontend-pa.googleapis.com,✨ Gemini
  - RULE-SET,gemini_auto,✨ Gemini
  - RULE-SET,youtube_auto,📺 YouTube
  - RULE-SET,okx_auto,🪙 OKX
  - DOMAIN-SUFFIX,okx.com,🪙 OKX
  - DOMAIN-SUFFIX,okex.com,🪙 OKX
  - DOMAIN-SUFFIX,oklink.com,🪙 OKX
  - DOMAIN-SUFFIX,polymarket.us,🎯 Polymarket US

  # 香港券商
