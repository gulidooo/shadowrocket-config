[YAML]
# OpenClash unified override - 2026-08-30
# 目标：复刻 Shadowrocket 策略；不包含机场订阅 URL/凭证。
# 设计：地区池 + 严格家宽池（排除“直连”）+ AI/YouTube/OKX/Polymarket + 国内 CDN 优先直连。

+proxy-groups:
  # ===== 普通地区池 =====
  - name: "🇭🇰 香港节点"
    type: url-test
    include-all-proxies: true
    filter: "(🇭🇰|HK|Hong|hong|香港|深港|沪港|京港)"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇹🇼 台湾节点"
    type: url-test
    include-all-proxies: true
    filter: "(🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化)"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇯🇵 日本节点"
    type: url-test
    include-all-proxies: true
    filter: "(🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪)"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇺🇸 美国节点"
    type: url-test
    include-all-proxies: true
    filter: "(🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约|沪美)"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  # ===== 严格家宽池：必须同时匹配地区 + 家宽，并排除“直连” =====
  - name: "🇭🇰 香港家宽"
    type: url-test
    include-all-proxies: true
    filter: "(家宽.*(🇭🇰|HK|Hong|hong|香港)|(🇭🇰|HK|Hong|hong|香港).*家宽)"
    exclude-filter: "直连"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇹🇼 台湾家宽"
    type: url-test
    include-all-proxies: true
    filter: "(家宽.*(🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣)|(🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣).*家宽)"
    exclude-filter: "直连"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇯🇵 日本家宽"
    type: url-test
    include-all-proxies: true
    filter: "(家宽.*(🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪)|(🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪).*家宽)"
    exclude-filter: "直连"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  - name: "🇺🇸 美国家宽"
    type: url-test
    include-all-proxies: true
    filter: "(家宽.*(🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约)|(🇺🇸|US|USA|America|america|United States|美国|凤凰城|洛杉矶|西雅图|芝加哥|纽约).*家宽)"
    exclude-filter: "直连"
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    lazy: false
    empty-fallback: REJECT

  # ===== 业务策略 =====
  - name: "✨ Gemini"
    type: select
    proxies: ["🇯🇵 日本家宽", "🇺🇸 美国家宽", "🇹🇼 台湾家宽", "🇭🇰 香港家宽", "🇯🇵 日本节点", "🇺🇸 美国节点", "🇹🇼 台湾节点", "🇭🇰 香港节点", "DIRECT", "REJECT"]

  - name: "📺 YouTube"
    type: select
    proxies: ["🇯🇵 日本家宽", "🇺🇸 美国家宽", "🇹🇼 台湾家宽", "🇭🇰 香港家宽", "🇯🇵 日本节点", "🇺🇸 美国节点", "🇹🇼 台湾节点", "🇭🇰 香港节点", "DIRECT", "REJECT"]

  - name: "🪙 OKX"
    type: select
    proxies: ["🇭🇰 香港家宽", "🇯🇵 日本家宽", "🇺🇸 美国家宽", "🇹🇼 台湾家宽", "🇭🇰 香港节点", "🇯🇵 日本节点", "🇺🇸 美国节点", "🇹🇼 台湾节点", "DIRECT", "REJECT"]

  - name: "🎯 Polymarket US"
    type: select
    proxies: ["🇺🇸 美国家宽", "🇺🇸 美国节点", "REJECT"]

  - name: "📈 香港券商"
    type: select
    proxies: ["🇭🇰 香港家宽", "🇭🇰 香港节点", "DIRECT", "REJECT"]

# 已有 ChatGPT：加入地区池/家宽池。使用之前在当前 OpenClash 环境验证过的单 where/set 结构。
proxy-groups*:
  where:
    name: '/ChatGPT$/'
  set:
    +proxies:
      - "🇯🇵 日本家宽"
      - "🇺🇸 美国家宽"
      - "🇹🇼 台湾家宽"
      - "🇭🇰 香港家宽"
      - "🇯🇵 日本节点"
      - "🇺🇸 美国节点"
      - "🇹🇼 台湾节点"
      - "🇭🇰 香港节点"

+rule-providers:
  gemini_auto:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google-gemini.mrs"

  youtube_auto:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs"

  okx_auto:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/okx.mrs"

  china_no_ip:
    type: http
    behavior: domain
    format: text
    interval: 86400
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMaxNoIP/ChinaMaxNoIP.list"

# 注意：这些规则必须位于机场宽泛 Global/MATCH 规则之前。
# OpenClash 覆写加载后请检查最终运行配置中的顺序；不要让 MATCH/FINAL 抢在它们前面。
+rules:
  # ===== AI / 国际业务 =====
  - DOMAIN,optimizationguide-pa.googleapis.com,✨ Gemini
  - DOMAIN,robinfrontend-pa.googleapis.com,✨ Gemini
  - DOMAIN,webchannel-robinfrontend-pa.googleapis.com,✨ Gemini
  - RULE-SET,gemini_auto,✨ Gemini
  - RULE-SET,youtube_auto,📺 YouTube
  - RULE-SET,okx_auto,🪙 OKX
  - DOMAIN-SUFFIX,okx.com,🪙 OKX
  - DOMAIN-SUFFIX,okex.com,🪙 OKX
  - DOMAIN-SUFFIX,oklink.com,🪙 OKX
  - DOMAIN-SUFFIX,polymarket.us,🎯 Polymarket US

  # ===== 香港券商 =====
  - DOMAIN-SUFFIX,itiger.com,📈 香港券商
  - DOMAIN-SUFFIX,tigerbrokers.com.hk,📈 香港券商
  - DOMAIN-SUFFIX,longbridge.com,📈 香港券商
  - DOMAIN-SUFFIX,longbridge.hk,📈 香港券商
  - DOMAIN-SUFFIX,longbridge.global,📈 香港券商
  - DOMAIN-SUFFIX,futuhk.com,📈 香港券商
  - DOMAIN-SUFFIX,futu5.com,📈 香港券商
  - DOMAIN-SUFFIX,futunn.com,📈 香港券商
  - DOMAIN-SUFFIX,usmart.hk,📈 香港券商
  - DOMAIN-SUFFIX,usmartsecurities.com,📈 香港券商
  - DOMAIN-SUFFIX,fosunwealth.com,📈 香港券商
  - DOMAIN-SUFFIX,chiefgroup.com.hk,📈 香港券商

  # ===== 国内 CDN 兜底：优先 DIRECT，避免京东等静态资源被 Global/MATCH 代理 =====
  - DOMAIN-SUFFIX,jd.com,DIRECT
  - DOMAIN-SUFFIX,jdimg.com,DIRECT
  - DOMAIN-SUFFIX,360buyimg.com,DIRECT
  - DOMAIN-SUFFIX,jdcdn.com,DIRECT
  - DOMAIN-SUFFIX,taobao.com,DIRECT
  - DOMAIN-SUFFIX,alicdn.com,DIRECT
  - DOMAIN-SUFFIX,alipay.com,DIRECT
  - DOMAIN-SUFFIX,tmall.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,qpic.cn,DIRECT
  - DOMAIN-SUFFIX,weixin.qq.com,DIRECT
  - DOMAIN-SUFFIX,gtimg.com,DIRECT
  - DOMAIN-SUFFIX,bdstatic.com,DIRECT
  - DOMAIN-SUFFIX,baidu.com,DIRECT
  - RULE-SET,china_no_ip,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
